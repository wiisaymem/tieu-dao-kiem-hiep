function fresh(name,sect){return{v:2,name,sect,rank:0,exp:0,silver:80,mat:0,seeds:3,herbs:0,inventory:[],gear:[null,null,null],plots:[null,null,null],wins:0,buff:0,last:Date.now()}}function valid(x){let item=g=>g&&Number.isInteger(g.slot)&&g.slot>=0&&g.slot<3&&Number.isInteger(g.rarity)&&g.rarity>=0&&g.rarity<4&&Number.isFinite(g.power)&&g.power>0&&g.power<1e6&&Number.isInteger(g.up)&&g.up>=0&&g.up<=20;return x&&x.v===2&&typeof x.name==='string'&&x.name.trim().length>0&&x.name.length<=24&&Number.isInteger(x.sect)&&x.sect>=0&&x.sect<3&&Number.isInteger(x.rank)&&x.rank>=0&&x.rank<22&&['exp','silver','mat','seeds','herbs','wins','last','buff'].every(k=>Number.isFinite(x[k])&&x[k]>=0)&&Array.isArray(x.inventory)&&x.inventory.length<=100&&x.inventory.every(item)&&Array.isArray(x.gear)&&x.gear.length===3&&x.gear.every((g,i)=>g===null||(item(g)&&g.slot===i))&&Array.isArray(x.plots)&&x.plots.length===3&&x.plots.every(p=>p===null||(Number.isFinite(p.ready)&&p.ready>=0))}function save(){if(s){s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}}function need(){return Math.floor(40*Math.pow(1.55,s.rank))}function rate(){return(2+s.rank*.8)*(Date.now()<s.buff?2:1)}function stats(){let atk=12+s.rank*5+(s.sect===1?6:s.sect===0?2:0),hp=100+s.rank*28+(s.sect===2?55:0),def=3+s.rank*2+(s.sect===2?3:0);s.gear.forEach((g,i)=>{if(g){let v=g.power+g.up*3;if(i===0)atk+=v;if(i===1){def+=v;hp+=v*2}if(i===2){hp+=v*4;atk+=Math.floor(v/3)}}});return{atk,hp,def,crit:s.sect===0?.25:.1}}
function title(){b=null;s=null;$('app').innerHTML='<div class="title">'+musicButton()+'<div class="title-content"><div class="eyebrow">MỘT ĐỜI TIÊU DAO • MỘT KIẾM TỰ TẠI</div><h1>Tiêu Dao Kiếm Hiệp</h1><span class="seal">Kiếm tâm vô hạn</span><p>Trăng soi cổ đạo, gió hát rừng trúc.<br>Giữa vạn dặm giang hồ, viết truyền kỳ của riêng mình.</p>'+scene()+'<button style="padding:15px 45px;font-size:19px" onclick="enter()">'+(localStorage.getItem(KEY)?'Tiếp tục hành tẩu':'Vào Game')+'</button><p class="muted">Tu luyện nhàn tản · Tam phái tranh phong · Điền viên tự tại</p><footer>Trò chơi nguyên bản • Không cần kết nối sau khi tải • Lưu trên thiết bị</footer></div></div>'}
function enter(){audio();let raw=localStorage.getItem(KEY);if(raw){try{let x=JSON.parse(raw);if(!valid(x))throw Error();s=x;let sec=Math.min(28800,Math.max(0,(Date.now()-s.last)/1000));let base=2+s.rank*.8,extra=Math.max(0,Math.min(Date.now(),s.buff)-Math.max(s.last,Date.now()-28800000))/1000;let gain=Math.floor(base*(sec+extra));s.exp+=gain;last=Date.now();save();tab=0;render();if(sec>15)popup('Bế quan '+num(sec)+' giây: nhận <b>'+num(gain)+' nội công</b>. Tính tối đa 8 giờ; linh thảo được tính đúng thời hạn. Cây trồng lớn theo thời gian thực.');return}catch(e){popup('Bản lưu không hợp lệ. Hãy tạo nhân vật rồi nhập mã sao lưu nếu có.')}}$('app').innerHTML='<main class="wrap"><span class="eyebrow">KHỞI ĐẦU MỘT TRUYỀN KỲ</span><h1>Khai mở giang hồ</h1><div class="panel"><label>Danh xưng (1–24 ký tự)<br><input id="name" maxlength="24" placeholder="Tên hiệp khách"></label><h3>Chọn môn phái</h3><div class="grid">'+sects.map((q,i)=>'<label class="sect"><input type="radio" name="sect" value="'+i+'" '+(!i?'checked':'')+'><img class="sprite" alt="'+q[0]+'" src="'+sprite(i)+'"><span><b>'+q[0]+'</b><p class="muted">'+q[1]+'</p></span></label>').join('')+'</div><p><button onclick="create()">Bắt đầu hành tẩu</button></p></div></main>'}function create(){let n=$('name').value.trim();if(!n){popup('Hãy chọn một danh xưng.');return}s=fresh(n,Number(document.querySelector('[name=sect]:checked').value));last=Date.now();save();tab=0;render()}function go(i){tab=i;fishing=null;render()}
function label(g){return '<span class="rare'+g.rarity+'">'+['Mộc','Thanh Vân','Ngân Nguyệt','Tử Hà'][g.rarity]+' '+['Kiếm','Giáp','Hộ Ngọc'][g.slot]+' · '+rarities[g.rarity]+' +'+g.up+' <small>(lực '+(g.power+g.up*3)+')</small></span>'}function cost(g){return 30*(g.up+1)*(g.rarity+1)}function header(){return '<div class="eyebrow">TIÊU DAO KIẾM HIỆP</div><h2>'+esc(s.name)+' <small>• '+sects[s.sect][0]+'</small></h2><span class="badge">☯ '+ranks[s.rank]+'</span><span class="badge" id="money">'+num(s.silver)+' bạc</span><span class="badge">✧ '+num(s.mat)+' linh tài</span>'}
function render(){if(!s)return;let st=stats(),h='';if(tab===0)h='<div class="grid"><section class="panel"><h2>Tu luyện tâm pháp</h2>'+scene()+'<h3 id="exp"></h3><div class="bar"><i id="expbar"></i></div><p class="muted" id="rate"></p><button onclick="breakthrough()" '+(s.rank===21?'disabled':'')+'>Đột phá cảnh giới</button><p class="tip muted">Nội công đủ đầy, chiến thắng Tâm Ma để bước sang cảnh giới mới. Thất bại không mất nội công.</p></section><section class="panel"><h2>Kiếm tâm nhật ký</h2><p>⚔ Công kích <b>'+num(st.atk)+'</b> · 🛡 Thủ <b>'+num(st.def)+'</b><br>♥ Sinh lực <b>'+num(st.hp)+'</b> · Bạo kích <b>'+Math.round(st.crit*100)+'%</b></p><p>Đã thắng '+s.wins+' trận • Linh thảo: '+s.herbs+'</p><button onclick="buff()">Dùng linh thảo · ×2 tu luyện / 5 phút</button><h3>Con đường võ đạo</h3><p class="muted">Nhập Môn → Hậu Thiên 1–9 tầng → Tiên Thiên 1–9 tầng → Đại Tông Sư → Võ Thánh → Kiếm Thần</p><div class="tip"><p>Gợi ý tân thủ</p><p class="muted">Giao đấu ở Trúc Lâm để lấy trang bị đầu tiên. Trồng linh thảo trong lúc luyện công. Nâng trang bị trước khi thách đấu thủ lĩnh.</p></div></section></div>';
if(tab===1)h='<section class="panel"><h2>Khu luyện công</h2><p class="muted">Tự động ra đòn mỗi 0,9 giây. Hồi đầy sinh lực đầu trận. Tối đa 50 lượt; thất bại không mất đồ. Đổi tab vẫn chiến đấu.</p>'+zones.map((z,i)=>'<div class="item"><b>'+z+'</b> <small>· Mở bậc '+i*4+'</small><button onclick="startFight('+i+',false)" '+(b||busy||s.rank<i*4?'disabled':'')+'>Giao đấu</button><button onclick="startFight('+i+',true)" '+(b||busy||s.rank<i*4?'disabled':'')+'>Thủ lĩnh</button></div>').join('')+'</section><section class="panel" id="battlePanel"><div id="combat"></div><div class="log" id="log"></div></section>';
if(tab===2)h='<section class="panel"><h2>Trang viên mây ngàn</h2><p class="muted">Mỗi vụ 2 phút thực → 2 linh thảo + 1 linh tài. Cây vẫn lớn khi rời trò chơi.</p><p>Hạt giống: '+s.seeds+' · Linh thảo: '+s.herbs+'</p><button onclick="buySeed()">Mua hạt · 15 bạc</button><button onclick="sellHerb()">Bán 1 linh thảo · 25 bạc</button><div class="grid">'+s.plots.map((p,i)=>'<div class="plot"><h3>Ruộng '+(i+1)+'</h3><div class="plant '+(!p?'empty':p.ready>Date.now()?'growing':'')+'"></div><p id="plot'+i+'"></p><button onclick="plant('+i+')">'+(p?'Thu hoạch':'Gieo hạt')+'</button></div>').join('')+'</div></section>';
if(tab===3)h='<section class="panel"><h2>Câu cá bên suối</h2><div class="scene"><div class="moon"></div><div class="ridge"></div><div class="cloud"></div><div class="water"></div><div class="actors">'+actor()+'</div></div><p>Thả câu, đợi vạch vàng vào vùng xanh (37–60%), rồi Giật cần.<br><small>Mỗi lần trúng được 20–39 bạc và 2 linh tài. Miễn phí thử lại.</small></p><div class="pond"><div class="target"></div><div class="marker" id="marker"></div></div><button onclick="cast()">Thả câu</button><button onclick="catchFish()">Giật cần</button><p id="fishText">Một cần trúc, một khoảng trời thanh thản.</p></section>';
if(tab===4)h='<div class="grid"><section class="panel"><h2>Nhân vật</h2>'+scene()+'<p>♥ Sinh lực '+num(st.hp)+' · ⚔ Công '+num(st.atk)+'<br>🛡 Thủ '+num(st.def)+' · ✦ Bạo kích '+Math.round(st.crit*100)+'% (sát thương ×1,8)</p><h3>Trang bị đang dùng</h3>'+s.gear.map((g,i)=>'<div class="item"><b>'+['Vũ khí','Áo giáp','Hộ ngọc'][i]+'</b><p>'+(g?label(g):'Chưa trang bị')+'</p>'+(g?'<button onclick="upgrade('+i+')">Cường hóa · '+num(cost(g))+' bạc + 1 linh tài</button>':'')+'</div>').join('')+'<h3>Túi đồ ('+s.inventory.length+'/100)</h3>'+s.inventory.map((g,i)=>'<div class="item">'+label(g)+'<br><button onclick="equip('+i+')">Trang bị</button><button onclick="sellItem('+i+')">Bán · '+(10+g.power*2)+' bạc</button></div>').join('')+'</section><section class="panel"><h2>Võ học tự động</h2>'+skillNames.map((n,i)=>'<div class="item"><b>'+n+'</b><p class="muted">'+(s.rank>=unlock[i]?'Đã lĩnh ngộ':'Mở tại bậc '+unlock[i])+' · '+['×1,6 sát thương; hồi 3 lượt','Hồi 28% sinh lực; hồi 5 lượt','×2,2 sát thương; hồi 4 lượt','×3,2 sát thương; hồi 6 lượt'][i]+'</p></div>').join('')+'<h3>Quản lý bản lưu</h3><p class="muted">Tự lưu mỗi 5 giây. Xuất mã để chuyển thiết bị; nhập mã thay thế tiến trình. Nên sao lưu trước khi xóa dữ liệu trình duyệt.</p><textarea id="saveCode" placeholder="Mã lưu trò chơi"></textarea><button onclick="exportSave()">Xuất mã</button><button onclick="importSave()">Nhập mã</button><button onclick="resetGame()">Xóa tiến trình</button><button onclick="save();title()">Về sảnh chờ</button><div style="position:relative;height:60px">'+musicButton()+'</div><p class="muted">Nhạc gốc tổng hợp WebAudio. Nút nhạc cũng bật/tắt hiệu ứng âm thanh.</p></section></div>';
$('app').innerHTML='<main class="wrap">'+header()+h+'<footer>Tiêu Dao Kiếm Hiệp • Tác phẩm nguyên bản • v2.0 • Không giao dịch tiền thật</footer></main><nav>'+['☯ Tu Luyện','⚔ Luyện Công','♧ Trang Viên','≈ Câu Cá','♙ Nhân Vật'].map((n,i)=>'<button class="'+(tab===i?'active':'')+'" onclick="go('+i+')">'+n+'</button>').join('')+'</nav>';update();if(tab===1)drawCombat()}
function update(){if(!s)return;if($('exp')){$('exp').textContent=num(s.exp)+' / '+num(need())+' nội công';$('expbar').style.width=Math.min(100,s.exp/need()*100)+'%';$('rate').textContent='+'+rate().toFixed(1)+' nội công / giây · '+(Date.now()<s.buff?'Linh thảo đang hiệu lực':'Tâm tĩnh như nước')}s.plots.forEach((p,i)=>{if($('plot'+i))$('plot'+i).textContent=!p?'Đất trống':Date.now()>=p.ready?'Linh thảo đã chín':'Còn '+Math.ceil((p.ready-Date.now())/1000)+' giây'})}
function equip(i){if(b||busy){popup('Hoàn tất trận đấu trước khi thay trang bị.');return}let g=s.inventory.splice(i,1)[0],old=s.gear[g.slot];s.gear[g.slot]=g;if(old)s.inventory.push(old);save();render();tone(660);document.querySelector('.panel').classList.add('loot')}function upgrade(i){let g=s.gear[i];if(g.up>=20){popup('Đã đạt cường hóa tối đa +20.');return}if(b||busy||s.silver<cost(g)||s.mat<1){popup('Cần đủ bạc và 1 linh tài; không cường hóa trong trận.');return}s.silver-=cost(g);s.mat--;g.up++;save();render();tone(800);burst()}function sellItem(i){let g=s.inventory.splice(i,1)[0];s.silver+=10+g.power*2;save();render()}
function log(t,c=''){logs.push('<p class="'+c+'">'+t+'</p>');logs=logs.slice(-70);if($('log')){$('log').innerHTML=logs.join('');$('log').scrollTop=$('log').scrollHeight}}function breakthrough(){if(b||busy){popup('Đang trong trận chiến.');return}if(s.rank>=21)return;if(s.exp<need()){popup('Chưa đủ nội công để đột phá.');return}tab=1;startFight(Math.floor(s.rank/4),true,true)}function startFight(z,boss,trial=false){if(b||busy||(!trial&&s.rank<z*4))return;audio();let st=stats(),lv=trial?s.rank:z*4,hp=(trial?65:boss?90:34)+lv*(trial?32:22);b={z,boss,trial,st,hp:st.hp,enemy:hp,max:hp,atk:(trial?9:boss?12:7)+lv*4,def:2+lv,turn:0,cd:[0,0,0,0],name:trial?'Tâm Ma · '+ranks[Math.min(21,s.rank+1)]:(boss?'Thủ lĩnh · ':'')+monsters[z]};logs=[];render();log('Chạm trán '+b.name+'!','skill')}
function drawCombat(){if(!$('combat'))return;let q=b;$('combat').innerHTML='<h3>'+(q?esc(q.name)+' · Lượt '+q.turn+'/50':'Kiếm tâm sẵn sàng')+'</h3>'+scene(true,q?q.z:0)+(q?'<div class="health-grid"><div><p>Hiệp khách · '+num(q.hp)+' / '+num(q.st.hp)+'</p><div class="bar"><i style="width:'+Math.max(0,q.hp/q.st.hp*100)+'%"></i></div></div><div><p>Đối thủ · '+num(q.enemy)+' / '+num(q.max)+'</p><div class="bar red"><i style="width:'+Math.max(0,q.enemy/q.max*100)+'%"></i></div></div></div>':'<p class="muted">Chọn một khu vực để hành tẩu.</p>');if($('log')){$('log').innerHTML=logs.join('');$('log').scrollTop=$('log').scrollHeight}}
function fx(dmg,strong=false){let a=$('arena');if(!a)return;let hero=a.querySelector('.hero-sprite'),en=a.querySelector('.enemy');hero.classList.add('attack');en.classList.add('hurt');let x=document.createElement('div');x.className='float';x.textContent='−'+dmg;a.append(x);let slash=document.createElement('div');slash.className='slash';a.append(slash);if(strong)a.classList.add('shake');setTimeout(()=>{if(!a.isConnected)return;hero.classList.remove('attack');en.classList.remove('hurt');en.classList.add('attack');hero.classList.add('hurt')},430);setTimeout(()=>{x.remove();slash.remove();if(a.isConnected){en.classList.remove('attack');hero.classList.remove('hurt');a.classList.remove('shake')}},820)}
function tickBattle(){if(!b||busy)return;let q=b;q.turn++;q.cd=q.cd.map(n=>Math.max(0,n-1));let sk=-1;for(let i=3;i>=0;i--)if(s.rank>=unlock[i]&&!q.cd[i]&&(i!==1||q.hp<q.st.hp*.7)){sk=i;break}let dmg=0,crit=false;if(sk===1){q.hp=Math.min(q.st.hp,q.hp+Math.floor(q.st.hp*.28));q.cd[1]=5;log('Hồi Nguyên Quyết · hồi phục 28% sinh lực.','skill')}else{let m=sk>=0?[1.6,1,2.2,3.2][sk]:1;if(sk>=0){q.cd[sk]=[3,5,4,6][sk];log(skillNames[sk]+'!','skill')}crit=Math.random()<q.st.crit;dmg=Math.max(1,Math.floor((q.st.atk*m-q.def)*(crit?1.8:1)));q.enemy-=dmg;log((crit?'Bạo kích! ':'')+'Gây '+dmg+' sát thương.','drop');tone(180,.1)}if(q.enemy<=0){busy=true;if(tab===1){drawCombat();fx(dmg,true);let e=document.querySelector('#arena .enemy');setTimeout(()=>{if(e)e.className='sprite enemy dead'},250)}setTimeout(()=>win(q),750);return}let incoming=Math.max(1,Math.floor(q.atk-q.st.def*.7));q.hp-=incoming;log(q.name+' gây '+incoming+' sát thương.','hit');if(q.hp<=0||q.turn>=50){log('Tạm lui dưỡng sức. Không mất vật phẩm hay nội công.','hit');b=null;save();render();return}if(tab===1){drawCombat();fx(dmg,crit||sk>=2)}}
function win(q){if(b!==q){busy=false;return}let money=(q.boss?45:18)*(q.z+1);s.silver+=money;s.mat+=q.boss?3:1;s.exp+=10*(q.z+1);s.wins++;log('Chiến thắng! +'+money+' bạc, +'+(q.boss?3:1)+' linh tài, +'+10*(q.z+1)+' nội công.','drop');if(q.trial){s.exp=Math.max(0,s.exp-need());s.rank++;log('Đột phá thành công: '+ranks[s.rank]+'!','skill');burst();tone(880,.4)}if(q.boss||s.wins===1||Math.random()<.65){let roll=Math.random(),rarity=roll>.98?3:roll>.86?2:roll>.55?1:0;if(q.boss)rarity=Math.max(1,rarity);let g={slot:Math.floor(Math.random()*3),rarity,power:6+q.z*2+rarity*5,up:0};if(s.inventory.length<100){s.inventory.push(g);log('Nhặt được '+label(g),'drop')}else{s.silver+=20;log('Túi đầy: đổi vật phẩm thành 20 bạc.','drop')}tone(660,.25)}b=null;busy=false;save();render();if($('battlePanel'))$('battlePanel').classList.add('loot')}
function cast(){audio();fishing={start:performance.now()};$('fishText').textContent='Chờ vạch vàng vào vùng xanh…'}function catchFish(){if(!fishing){$('fishText').textContent='Hãy thả câu trước.';return}let p=(Math.sin((performance.now()-fishing.start)/600)+1)*50;fishing=null;if(p>=37&&p<=60){let gain=20+Math.floor(Math.random()*20);s.silver+=gain;s.mat+=2;$('fishText').textContent='Cá Ngân Suối! +'+gain+' bạc, +2 linh tài.';$('money').textContent=num(s.silver)+' bạc';tone(700);save()}else $('fishText').textContent='Cá thoát rồi! Thử lại, không mất gì cả.'}
function buySeed(){if(s.silver<15){popup('Cần 15 bạc.');return}s.silver-=15;s.seeds++;save();render()}function plant(i){let p=s.plots[i];if(!p){if(!s.seeds){popup('Đã hết hạt giống.');return}s.seeds--;s.plots[i]={ready:Date.now()+120000}}else if(Date.now()>=p.ready){s.herbs+=2;s.mat++;s.plots[i]=null;tone(700);burst()}else{popup('Linh thảo chưa chín. Hãy trở lại sau ít phút.');return}save();render()}function sellHerb(){if(!s.herbs){popup('Chưa có linh thảo.');return}s.herbs--;s.silver+=25;save();render()}function buff(){if(!s.herbs){popup('Trồng và thu hoạch linh thảo tại Trang Viên trước.');return}s.herbs--;s.buff=Math.max(Date.now(),s.buff)+300000;save();render();burst()}
function exportSave(){save();$('saveCode').value=btoa(unescape(encodeURIComponent(JSON.stringify(s))));$('saveCode').select()}function importSave(){if(b||busy){popup('Hoàn tất trận đấu trước khi nhập mã.');return}try{let x=JSON.parse(decodeURIComponent(escape(atob($('saveCode').value.trim()))));if(!valid(x))throw Error();if(!confirm('Thay tiến trình hiện tại bằng mã này?'))return;s=x;last=Date.now();save();render();popup('Nhập bản lưu thành công.')}catch(e){popup('Mã lưu không hợp lệ hoặc không tương thích.')}}function resetGame(){if(b||busy){popup('Hoàn tất trận đấu trước khi xóa.');return}if(confirm('Xóa toàn bộ tiến trình? Hãy xuất mã trước nếu muốn giữ lại.')){localStorage.removeItem(KEY);title()}}
setInterval(()=>{let now=Date.now(),dt=Math.max(0,Math.min(28800,(now-last)/1000));last=now;if(s){s.exp+=rate()*dt;update()}},250);setInterval(tickBattle,900);setInterval(save,5000);function frame(){if(fishing&&$('marker'))$('marker').style.left=((Math.sin((performance.now()-fishing.start)/600)+1)*50)+'%';requestAnimationFrame(frame)}frame();window.addEventListener('pagehide',save);document.addEventListener('pointerdown',audio,{once:true});title();
</script></html>
